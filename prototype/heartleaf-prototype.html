<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心叶 Heart Leaf · 交互原型 v6</title>
<style>
/* v4 设计：莫兰迪 · 纯净白 · 简洁现代 */
:root {
  --bg: #FFFFFF;           /* 纯净白底 */
  --surface: #F6F5F3;      /* 输入/底板浅灰 */
  --ink: #3E3A37;          /* 主文字 */
  --ink-soft: #9B9792;     /* 次要文字 */
  --line: #E8E6E2;         /* 分隔线 */
  --leaf: #7E9280;         /* 莫兰迪鼠尾草绿 */
  --leaf-deep: #5E7060;
  /* 莫兰迪心情色（低饱和灰调） */
  --m-happy: #9BAE9A;      /* 灰绿 */
  --m-calm: #8FA8B5;       /* 灰蓝 */
  --m-tired: #A69CAE;      /* 灰紫 */
  --m-down: #7E8EA5;       /* 蓝灰 */
  --m-anxious: #C2A08A;    /* 灰赭 */
  --m-angry: #BF8F84;      /* 灰陶 */
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#EFEFEF; display:flex; flex-direction:column; align-items:center;
  padding:18px 10px; min-height:100vh;
}
/* ============ 手机外壳 ============ */
.phone {
  width:100%; max-width:400px; height:calc(100vh - 36px); min-height:640px; max-height:900px;
  background:var(--bg); border-radius:34px; overflow:hidden; position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.12); display:flex; flex-direction:column;
}
/* ============ 顶栏 ============ */
.appbar { display:flex; align-items:center; gap:12px; padding:16px 16px 8px; z-index:20; }
.hamburger {
  width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:18px; color:var(--ink);
}
.hamburger:active { background:#EDECE9; }
.logo-leaf { font-size:24px; }
.appbar .titles { display:flex; flex-direction:column; }
.appbar h1 { font-size:26px; font-weight:600; color:var(--ink); letter-spacing:3px; line-height:1.15; }
.appbar .subtitle { font-size:11px; color:var(--ink-soft); letter-spacing:2px; }
/* ============ 页面 ============ */
.screen { flex:1; overflow-y:auto; display:none; }
.screen.active { display:flex; flex-direction:column; }
.screen-inner { flex:1; overflow-y:auto; padding:8px 16px 96px; }
/* ============ 底部导航 ============ */
.tabbar {
  position:absolute; bottom:0; left:0; right:0; height:78px;
  background:#FFFFFF; display:flex; padding-bottom:8px;
  border-top:1px solid var(--line);
}
.tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--ink-soft); font-size:13px; cursor:pointer; letter-spacing:2px; }
.tab.active { color:var(--leaf-deep); }
.tab .ti { font-size:22px; line-height:1; transition:transform .2s; }
.tab.active .ti { transform:translateY(-3px) scale(1.08); }
/* ============ 卡片 ============ */
.card {
  position:relative; margin:14px 0 16px; padding:18px 18px 16px;
  background:#FFFFFF; border:1px solid var(--line); border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.cardhead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.mood-ico {
  width:32px; height:32px; border-radius:50%; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
.mood-name { font-size:14px; color:var(--ink); letter-spacing:1px; }
.cardhead .time { font-size:13px; color:var(--ink-soft); letter-spacing:1px; margin-left:auto; }
.cardhead .date { font-size:12px; color:var(--ink-soft); letter-spacing:1px; margin-left:auto; }
/* ============ 顶部周视图 ============ */
.week-strip {
  display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px; margin-bottom:4px;
  -webkit-overflow-scrolling:touch;
}
.week-day {
  flex-shrink:0; width:52px; display:flex; flex-direction:column; align-items:center;
  gap:6px; padding:8px 0; border-radius:14px; background:var(--surface); cursor:pointer;
}
.week-day.today { background:var(--leaf); }
.week-day .w-label { font-size:11px; color:var(--ink-soft); letter-spacing:1px; }
.week-day.today .w-label { color:rgba(255,255,255,.85); }
.week-day .w-num { font-size:15px; font-weight:600; color:var(--ink); }
.week-day.today .w-num { color:#fff; }
.week-day .w-mood { font-size:16px; line-height:1; min-height:16px; }
.timeline { position:relative; padding-left:44px; margin:6px 0 20px; }
.timeline::before {
  content:""; position:absolute; left:23px; top:8px; bottom:12px; width:2px;
  background:rgba(126,146,128,.28); border-radius:2px;
}
.tl-day { margin-bottom:4px; }
.tl-daydate {
  position:relative; display:flex; align-items:center; gap:9px;
  margin:20px 0 4px; margin-left:-44px; padding-left:44px;
}
.tl-daydate .node {
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; border-radius:50%;
  background:#fff; border:3px solid var(--leaf);
  box-shadow:0 0 0 2px rgba(126,146,128,.25);
}
.tl-daydate b { font-size:14px; font-weight:600; color:var(--ink); letter-spacing:1px; }
.tl-day .card::before {
  content:""; position:absolute; left:-20px; top:24px; width:20px; height:2px;
  background:rgba(126,146,128,.28); border-radius:2px;
}
.card .body { font-size:16px; color:var(--ink); line-height:1.9; letter-spacing:.5px; }
.card .body.limit { -webkit-line-clamp:5; line-clamp:5; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
.card .photo { width:100%; height:160px; border-radius:12px; margin-top:12px; object-fit:cover; border:1px solid var(--line); }
.tags { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.tag {
  font-size:12px; color:var(--leaf-deep); border:1px solid var(--line);
  border-radius:999px; padding:3px 12px; background:var(--surface); letter-spacing:1px;
}
/* ============ 按钮 ============ */
.btn-primary {
  background:var(--leaf); color:#fff; border:none; border-radius:14px;
  padding:13px 36px; font-size:16px; font-family:inherit; letter-spacing:2px; cursor:pointer;
  transition:.12s;
}
.btn-primary:active { transform:translateY(2px); opacity:.85; }
.fab {
  position:fixed; right:calc(50% - 166px); bottom:94px; width:54px; height:54px;
  background:#1A1A1A; border-radius:50%; border:none; color:#fff;
  font-size:22px; box-shadow:0 6px 16px rgba(0,0,0,.35); cursor:pointer; z-index:40;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.fab:active { transform:scale(.92); }
/* ============ 表单 ============ */
.field { margin-bottom:20px; }
.section-label { font-size:13px; color:var(--ink-soft); margin-bottom:10px; letter-spacing:2px; display:inline-block; }
.editor {
  width:100%; min-height:200px; border:1px solid var(--line); border-radius:14px;
  background:var(--surface); padding:16px; font-size:16px; line-height:1.9; letter-spacing:.5px;
  font-family:inherit; color:var(--ink); resize:none;
}
.editor:focus { outline:none; border-color:var(--leaf); background:#fff; }
.editor-date {
  width:100%; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); padding:12px 16px; font-size:15px;
  font-family:inherit; color:var(--ink); letter-spacing:1px;
}
.editor-date:disabled { color:var(--ink-soft); -webkit-text-fill-color:var(--ink-soft); }
.editor-date:focus { outline:none; border-color:var(--leaf); }
.mood-scroll { display:flex; gap:10px; overflow-x:auto; padding:4px 0 10px; }
.mood-pill {
  border-radius:12px; padding:10px 15px; font-size:14px; white-space:nowrap;
  border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  font-family:inherit; letter-spacing:1px; transition:transform .15s;
}
.mood-pill.active { color:#fff; border-color:transparent; box-shadow:0 3px 8px rgba(0,0,0,.12); transform:translateY(-2px); }
.mood-pill.active[data-mood="happy"]   { background:var(--m-happy); }
.mood-pill.active[data-mood="calm"]    { background:var(--m-calm); }
.mood-pill.active[data-mood="tired"]   { background:var(--m-tired); }
.mood-pill.active[data-mood="down"]    { background:var(--m-down); }
.mood-pill.active[data-mood="anxious"] { background:var(--m-anxious); }
.mood-pill.active[data-mood="angry"]   { background:var(--m-angry); }
.tag-scroll { display:flex; gap:10px; flex-wrap:wrap; }
.tag-pill {
  border-radius:12px; padding:9px 16px; font-size:14px;
  border:1px solid var(--line); background:#fff; color:var(--ink);
  cursor:pointer; font-family:inherit; letter-spacing:2px;
}
.tag-pill.active { background:var(--leaf); color:#fff; border-color:var(--leaf); }
/* ============ 侧边栏 ============ */
.sidebar-mask {
  position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.sidebar-mask.show { opacity:1; pointer-events:auto; }
.sidebar {
  position:absolute; top:0; bottom:0; left:0; width:88%; max-width:350px;
  background:#fff; z-index:70; box-shadow:10px 0 40px rgba(0,0,0,.15);
  transform:translateX(-102%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; padding:20px 18px; overflow:hidden;
}
.sidebar.show { transform:translateX(0); }
.sidebar-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.sidebar-head h2 { font-size:22px; font-weight:600; color:var(--ink); letter-spacing:2px; }
.sidebar-head .book-btn {
  border:1px solid var(--line); background:var(--surface); border-radius:10px;
  padding:7px 13px; font-family:inherit; font-size:13px; color:var(--leaf-deep); cursor:pointer;
  letter-spacing:1px;
}
.calhead { display:flex; align-items:center; justify-content:space-between; padding:8px 2px; }
.calhead .arrow {
  width:34px; height:34px; border-radius:10px; cursor:pointer; color:var(--leaf-deep);
  font-size:16px; background:var(--surface); border:1px solid var(--line); font-family:inherit;
}
.cal-title { font-size:16px; color:var(--ink); letter-spacing:1px; font-weight:500; }
.cal-week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--ink-soft); margin:8px 0 6px; letter-spacing:1px; }
.cal-week span { display:flex; align-items:center; justify-content:center; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:14px; color:var(--ink); cursor:pointer; border-radius:11px; transition:.15s; }
.day:active { background:var(--surface); }
.day.today .day-num { background:var(--leaf); color:#fff; box-shadow:0 3px 6px rgba(126,146,128,.35); }
.day-num { width:31px; height:31px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.day-empty { aspect-ratio:1; }
.dots { display:flex; gap:3px; margin-top:3px; }
.dots span { width:5px; height:5px; border-radius:50%; background:var(--leaf-deep); opacity:.7; }
.sidebar .diary-hint {
  margin-top:auto; text-align:center; font-size:12px; color:var(--ink-soft);
  border-top:1px solid var(--line); padding-top:12px; letter-spacing:1px;
}
/* ============ 统计 ============ */
.seg { display:flex; background:var(--surface); border-radius:14px; padding:5px; border:1px solid var(--line); margin-bottom:18px; }
.seg button { flex:1; border:none; background:transparent; padding:10px; border-radius:11px; font-size:14px; color:var(--ink-soft); cursor:pointer; font-family:inherit; letter-spacing:3px; }
.seg button.active { background:var(--leaf); color:#fff; }
.chart-card { display:flex; gap:16px; align-items:center; }
.ring { width:128px; height:128px; position:relative; flex-shrink:0; }
.ring-center { position:absolute; inset:31px; background:#fff; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-center b { font-size:22px; color:var(--ink); font-weight:600; }
.ring-center span { font-size:11px; color:var(--ink-soft); }
.legend { flex:1; }
.legend-row { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); margin-bottom:7px; }
.legend-row .dot { width:10px; height:10px; border-radius:50%; }
.legend-row .cnt { margin-left:auto; color:var(--ink-soft); font-size:12px; }
.bar-row { margin-bottom:11px; }
.bar-head { display:flex; justify-content:space-between; font-size:13px; color:var(--ink); margin-bottom:5px; }
.bar-track { height:10px; border-radius:999px; background:var(--surface); overflow:hidden; border:1px solid var(--line); }
.bar-fill { height:100%; border-radius:999px; }
.heat-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.heat-cell { aspect-ratio:1; border-radius:5px; background:var(--surface); }
.heat-legend { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft); margin-top:8px; }
.heat-legend .cell { width:12px; height:12px; border-radius:3px; }
/* ============ 设置 ============ */
.set-row { display:flex; align-items:center; justify-content:space-between; padding:17px; font-size:15px; color:var(--ink); }
.set-row + .set-row { border-top:1px solid var(--line); }
.switch { width:48px; height:29px; border-radius:999px; background:var(--surface); position:relative; cursor:pointer; transition:.2s; border:1px solid var(--line); }
.switch.on { background:var(--leaf); border-color:var(--leaf); }
.switch::after { content:""; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.switch.on::after { left:22px; }
.header-card { display:flex; align-items:center; gap:14px; padding:20px 18px; margin-bottom:18px; }
.header-card .logo { width:60px; height:60px; border-radius:18px; background:var(--leaf); display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.5), 0 4px 10px rgba(126,146,128,.35); }
.header-card .name { font-size:19px; color:var(--ink); letter-spacing:3px; font-weight:600; }
.header-card .slogan { font-size:12px; color:var(--ink-soft); letter-spacing:1px; }
/* ============ 空态 ============ */
.empty { text-align:center; padding:70px 20px; color:var(--ink-soft); }
.empty .ei { font-size:56px; display:block; margin-bottom:16px; }
.empty p { font-size:15px; line-height:2.2; letter-spacing:1px; }
.future-hint { text-align:center; padding:24px 20px; color:var(--ink-soft); font-size:14px; line-height:2.2; letter-spacing:1px; }
/* ============ 弹层 ============ */
.modal-mask { position:absolute; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:110; }
.modal-mask.show { display:flex; }
.modal { width:88%; max-width:330px; background:#fff; border-radius:20px; padding:28px 24px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.2); }
.modal h3 { font-size:18px; color:var(--ink); font-weight:600; margin-bottom:10px; letter-spacing:2px; }
.modal p { font-size:14px; color:var(--ink-soft); margin-bottom:22px; line-height:1.9; }
.modal .btns { display:flex; gap:10px; }
.modal .btns button { flex:1; padding:12px; border-radius:12px; border:1px solid var(--line); font-size:15px; cursor:pointer; font-family:inherit; letter-spacing:1px; }
.modal .cancel { background:var(--surface); color:var(--ink-soft); }
.modal .danger { background:var(--m-angry); color:#fff; border-color:transparent; }
/* ============ 覆盖层页面 ============ */
.overlay-page { position:absolute; inset:0; background:#fff; z-index:80; display:none; flex-direction:column; }
.overlay-page.show { display:flex; }
.ov-topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px; }
.ov-topbar button { border:none; background:transparent; font-family:inherit; font-size:15px; cursor:pointer; color:var(--ink-soft); padding:8px; letter-spacing:1px; }
.ov-topbar .save-btn { color:var(--leaf-deep); font-size:17px; font-weight:600; }
.ov-topbar h2 { font-size:18px; font-weight:600; color:var(--ink); letter-spacing:3px; }
.ov-body { flex:1; overflow-y:auto; padding:10px 18px 40px; }
.ov-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.ov-head .back-btn { border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 13px; font-family:inherit; font-size:14px; color:var(--leaf-deep); cursor:pointer; }
.ov-head b { font-size:16px; font-weight:600; color:var(--ink); letter-spacing:1px; }
/* 日记 */
.diary-viewer { flex:1; position:relative; overflow:hidden; margin:0 4px; }
.diary-page-slot { position:absolute; inset:0; transition:transform .35s, opacity .35s; }
.diary-page-slot.prev { transform:translateX(-100%); opacity:0; }
.diary-page-slot.next { transform:translateX(100%); opacity:0; }
.diary-cover {
  background:var(--surface); border-radius:16px; border:1px solid var(--line);
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:24px;
}
.diary-cover .leaf { font-size:48px; }
.diary-cover h2 { font-size:26px; font-weight:600; color:var(--ink); letter-spacing:4px; }
.diary-cover p { font-size:14px; color:var(--ink-soft); text-align:center; line-height:2.2; }
.diary-page-view { background:#fff; border-radius:16px; border:1px solid var(--line); height:100%; overflow-y:auto; padding:20px; }
.diary-nav { display:flex; align-items:center; justify-content:space-between; padding-top:14px; }
.diary-nav button { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 18px; color:var(--leaf-deep); font-size:14px; cursor:pointer; font-family:inherit; }
.diary-nav .pageinfo { font-size:12px; color:var(--ink-soft); letter-spacing:1px; }
/* ============ 动画 ============ */
@keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.card { animation:fadeUp .35s ease backwards; }
::-webkit-scrollbar { width:0; height:0; }
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- ==================== 顶栏 ==================== -->
  <div class="appbar">
    <button class="hamburger" onclick="openSidebar()">☰</button>
    <span class="logo-leaf">🍃</span>
    <div class="titles">
      <h1 id="app-title">心叶</h1>
      <div class="subtitle">记录 · 倾听 · 陪伴</div>
    </div>
  </div>

  <!-- ==================== 时间线 ==================== -->
  <div class="screen active" id="screen-timeline">
    <div class="screen-inner" id="timeline-body">
      <div class="week-strip" id="week-strip"></div>
      <div id="timeline-list"></div>
    </div>
    <button class="fab" onclick="openEditor()">✎</button>
  </div>

  <!-- ==================== 统计 ==================== -->
  <div class="screen" id="screen-stats">
    <div class="screen-inner">
      <div class="seg">
        <button id="seg-month" class="active" onclick="setPeriod('month')">本月</button>
        <button id="seg-all" onclick="setPeriod('all')">全部</button>
      </div>
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <b style="font-size:16px; font-weight:600; color:var(--ink); letter-spacing:1px;">记录热力图</b>
          <div style="display:flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft);">
            少
            <span class="heat-cell" style="background:rgba(126,146,128,.2);"></span>
            <span class="heat-cell" style="background:rgba(126,146,128,.35);"></span>
            <span class="heat-cell" style="background:rgba(126,146,128,.5);"></span>
            <span class="heat-cell" style="background:rgba(126,146,128,.68);"></span>
            <span class="heat-cell" style="background:rgba(126,146,128,.85);"></span>
            <span class="heat-cell" style="background:var(--leaf);"></span>
            多
          </div>
        </div>
        <div class="heat-grid" id="heat-grid"></div>
      </div>
      <div class="card chart-card">
        <div class="ring" id="mood-ring"></div>
        <div class="legend" id="mood-legend"></div>
      </div>
      <div class="card">
        <b style="font-size:16px; font-weight:600; color:var(--ink); display:block; margin-bottom:14px; letter-spacing:1px;">标签占比</b>
        <div id="tag-bars"></div>
      </div>
    </div>
  </div>

  <!-- ==================== 我的 ==================== -->
  <div class="screen" id="screen-settings">
    <div class="screen-inner">
      <div class="card header-card">
        <div class="logo">🍃</div>
        <div>
          <div class="name">心叶</div>
          <div class="slogan">给无处安放的情绪，一片心形的叶子</div>
        </div>
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div class="set-row">
          <span>首页用输入页</span>
          <div class="switch" onclick="this.classList.toggle('on')"></div>
        </div>
        <div class="set-row" onclick="alert('心叶 v6.0 交互原型\n莫兰迪 · 纯净白 · 数据仅保存在本机')" style="cursor:pointer;">
          <span>关于心叶</span><span style="color:var(--ink-soft);">›</span>

        <div class="set-row" onclick="showClearModal()" style="cursor:pointer; color:var(--m-angry);">
          <span>清空所有记录</span><span style="color:var(--ink-soft);">›</span>
        </div>
      </div>
      <div style="text-align:center; font-size:12px; color:var(--ink-soft); margin-top:20px; letter-spacing:1px; line-height:2.2;">
        心叶 v6.0 · 莫兰迪纯净风<br>HTML 交互原型 · 对应 iOS 源码
      </div>
    </div>
  </div>

  <!-- ==================== 编辑页 ==================== -->
  <div class="overlay-page" id="overlay-editor">
    <div class="ov-topbar">
      <button onclick="closeEditor()">取消</button>
      <h2 id="editor-title">新记录</h2>
      <button class="save-btn" onclick="saveRecord()">保存</button>
    </div>
    <div class="ov-body">
      <div class="field">
        <div class="section-label">日期</div>
        <input type="date" id="editor-date" class="editor-date" disabled>

      <div class="field">
        <div class="section-label">此刻的心情</div>
        <div class="mood-scroll" id="mood-scroll"></div>
      </div>
      <div class="field">
        <div class="section-label">标签（可多选）</div>
        <div class="tag-scroll" id="tag-scroll"></div>

        <textarea class="editor" id="editor-text" placeholder="写下此刻的碎碎念…"></textarea>

        <div class="section-label">配一张照片（可选）</div>
        <input type="file" id="photo-input" accept="image/*" style="display:none;">
        <div id="photo-area" onclick="document.getElementById('photo-input').click()" style="border:1px dashed var(--line); border-radius:14px; height:96px; display:flex; align-items:center; justify-content:center; color:var(--leaf-deep); font-size:14px; cursor:pointer; letter-spacing:1px; background:var(--surface);">📷 从相册选择照片</div>

  <!-- ==================== 日期详情 ==================== -->
  <div class="overlay-page" id="overlay-day">
    <div class="ov-head" style="padding:16px 16px 6px;">
      <button class="back-btn" onclick="closeDay()">‹ 返回</button>
      <b id="day-title"></b>
    </div>
    <div class="ov-body" id="day-body"></div>
  </div>

  <!-- ==================== 月度日记 ==================== -->
  <div class="overlay-page" id="overlay-diary">
    <div class="ov-topbar">
      <button onclick="closeDiary()">✕ 关闭</button>
      <h2>月度日记</h2>
      <button style="visibility:hidden;">　</button>
    </div>
    <div class="ov-body" style="padding-bottom:20px;">
      <div class="diary-viewer" id="diary-viewer"></div>
      <div class="diary-nav">
        <button onclick="diaryFlip(-1)">‹ 上一页</button>
        <span class="pageinfo" id="diary-info"></span>
        <button onclick="diaryFlip(1)">下一页 ›</button>
      </div>
    </div>
  </div>

  <!-- ==================== 侧边栏 ==================== -->
  <div class="sidebar-mask" id="sidebar-mask" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h2>日历</h2>
      <button class="book-btn" onclick="closeSidebar(); openDiary();">📖 月度日记</button>
    </div>
    <div class="calhead">
      <button class="arrow" onclick="calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);renderSidebarCalendar();">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button class="arrow" onclick="calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);renderSidebarCalendar();">›</button>
    </div>
    <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="diary-hint">✍️ 点击日期查看当天的记录</div>
  </div>

  <!-- ==================== 弹层 ==================== -->
  <div class="modal-mask" id="clear-modal">
    <div class="modal">
      <h3>确定清空所有记录吗？</h3>
      <p>此操作不可恢复，所有碎碎念将被删除。</p>
      <div class="btns">
        <button class="cancel" onclick="hideClearModal()">取消</button>
        <button class="danger" onclick="clearAll()">清空</button>
      </div>

  <!-- ==================== 底部导航 ==================== -->
  <div class="tabbar">
    <div class="tab active" data-tab="timeline" onclick="switchTab('timeline')"><span class="ti">✍️</span>记录</div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')"><span class="ti">📊</span>统计</div>
    <div class="tab" data-tab="settings" onclick="switchTab('settings')"><span class="ti">👤</span>我的</div>
  </div>
</div>

<script>
// ==================== 数据层 ====================
const MOODS = [
  { key:'happy',   label:'开心', color:'#9BAE9A', icon:'☺' },
  { key:'calm',    label:'平静', color:'#8FA8B5', icon:'≋' },
  { key:'tired',   label:'疲惫', color:'#A69CAE', icon:'❦' },
  { key:'down',    label:'低落', color:'#7E8EA5', icon:'ϡ' },
  { key:'anxious', label:'焦虑', color:'#C2A08A', icon:'ϟ' },
  { key:'angry',   label:'愤怒', color:'#BF8F84', icon:'☄' },
];
const TAGS = ['工作','生活','灵感'];
const TARCO = { '工作':'#6F826F', '生活':'#8FA8B5', '灵感':'#C2A08A' };
const PHOTO_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220">' +
  '<rect width="400" height="220" fill="#F2F1EF"/>' +
  '<circle cx="200" cy="100" r="60" fill="#C9D4C7"/>' +
  '<text x="200" y="125" font-size="56" text-anchor="middle">🍃</text></svg>');

let records = load();
function load(){ try{ return JSON.parse(localStorage.getItem('heartleaf.records')) || []; }catch(e){ return []; } }
function save(){ localStorage.setItem('heartleaf.records', JSON.stringify(records)); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function seed(){
  if(records.length) return;
  const now = new Date();
  const mk = (daysAgo, h, m, mood, text, tags, photo) => {
    const d = new Date(now); d.setDate(d.getDate()-daysAgo); d.setHours(h,m,0,0);
    records.push({ id:Date.now()+Math.random(), text, mood, tags, photo, createdAt:d.toISOString() });
  };
  mk(0, 8,12, 'anxious', '项目上线前的一晚，心跳有点快。深呼吸，能行的。', ['工作'], true);
  mk(1, 23,40, 'down', '今天在地铁上看到一对老夫妻牵着手，突然有点想家。', ['生活'], false);
  mk(2, 14,5, 'happy', '灵感闪现！给「心叶」的月度日记加上翻页动画，像拆盲盒。', ['灵感'], true);
  mk(4, 20,30, 'calm', '晚上跑了 5 公里，风很凉，月亮很圆。世界安静下来了。', ['生活'], false);
  mk(6, 9,15, 'tired', '连续加班第三天，咖啡续命。午休补觉，下午重新出发。', ['工作'], false);
  save();
}
seed();

// ==================== 工具 ====================
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso){ const d=new Date(iso); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtDateTime(iso){ const d=new Date(iso); return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtTime(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function moodOf(key){ return MOODS.find(m=>m.key===key) || MOODS[1]; }
function tagsHtml(tags){ return (tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join(''); }
function photoHtml(photo){ return photo ? '<img class="photo" src="'+(photo===true?PHOTO_SVG:photo)+'">' : ''; }
function cardHtml(r, limit){
  const md = moodOf(r.mood);
  return '<div class="card">' +
    '<div class="cardhead">' +
      '<span class="mood-ico" style="background:'+md.color+';">'+md.icon+'</span>' +
      '<span class="mood-name">'+md.label+'</span>' +
      '<span class="time">'+fmtTime(r.createdAt)+'</span>' +
    '</div>' +
    '<div class="body'+(limit?' limit':'')+'">'+esc(r.text)+'</div>' +
    photoHtml(r.photo) +
    tagsHtml(r.tags) +
  '</div>';
}

// ==================== 导航 ====================
function switchTab(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('screen-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  if(name==='timeline') renderTimeline();
  if(name==='stats') renderStats();
}

// ==================== 侧边栏 ====================
function openSidebar(){ $('sidebar-mask').classList.add('show'); $('sidebar').classList.add('show'); renderSidebarCalendar(); }
function closeSidebar(){ $('sidebar-mask').classList.remove('show'); $('sidebar').classList.remove('show'); }
let calMonth = new Date();
function renderSidebarCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  $('cal-title').textContent = y+'年'+(m+1)+'月';
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const today = todayKey();
  const count = {};
  records.forEach(r=>{ const d=new Date(r.createdAt); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); count[k]=(count[k]||0)+1; });
  let html = '';
  for(let i=0;i<first;i++) html += '<div class="day-empty"></div>';
  for(let d=1; d<=days; d++){
    const k = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = k===today;
    const isFuture = k>today;
    const dots = Math.min(count[k]||0,3);
    html += '<div class="day'+(isToday?' today':'')+'"'+(isFuture?' style="color:var(--ink-soft); opacity:.5;"':'')+' onclick="showDay(\''+k+'\')"><span class="day-num">'+d+'</span><span class="dots">'+'<span></span>'.repeat(dots)+'</span></div>';
  }
  $('cal-grid').innerHTML = html;
}

// ==================== 日期详情 ====================
let calDate = null;
function showDay(key){
  calDate = key;
  closeSidebar();
  $('overlay-day').classList.add('show');
  const today = todayKey();
  const dayRecords = records.filter(r=>r.createdAt.slice(0,10)===key);
  const kk = key.split('-');
  $('day-title').textContent = Number(kk[1])+'月'+Number(kk[2])+'日';
  const body = $('day-body');
  const cards = dayRecords.length
    ? dayRecords.map(r=>cardHtml(r,false)).join('')
    : '<div class="empty"><span class="ei">🍃</span><p>这一天还没有记录</p></div>';
  let action = '';
  if(key > today){
    action = '<div class="future-hint">🕰️ 未来的日子还没有到来<br>到那一天再记录吧</div>';
  } else if(key === today){
    action = '<button class="btn-primary" style="width:100%;margin-top:12px;" onclick="closeDay();openEditor(null,\''+key+'\')">✍️ 记录今天</button>';
  } else {
    action = '<button class="btn-primary" style="width:100%;margin-top:12px;" onclick="closeDay();openEditor(null,\''+key+'\')">✍️ 补记一条</button>';
  }
  body.innerHTML = cards + action;
}
function closeDay(){ $('overlay-day').classList.remove('show'); }

// ==================== 编辑 ====================
let editId = null;
function openEditor(id, presetDateKey){
  editId = id || null;
  $('overlay-editor').classList.add('show');
  $('mood-scroll').innerHTML = MOODS.map(m=>'<div class="mood-pill'+(m.key==='calm'?' active':'')+'" data-mood="'+m.key+'" style="'+(m.key==='calm'?'background:'+m.color+';color:#fff;': '')+'" onclick="pickMood(this)">'+m.icon+' '+m.label+'</div>').join('');
  $('tag-scroll').innerHTML = TAGS.map(t=>'<div class="tag-pill" data-tag="'+t+'" onclick="pickTag(this)">'+t+'</div>').join('');
  $('editor-text').value = '';
  $('photo-area').innerHTML = '📷 从相册选择照片';
  $('photo-area').style.height = '96px';
  window.selectedPhoto = null;
  $('editor-title').textContent = '新记录';

  const today = todayKey();
  const dateEl = $('editor-date');
  dateEl.disabled = true;
  dateEl.value = presetDateKey || today;

  if(id){
    const r = records.find(x=>x.id===id);
    if(r){
      document.querySelectorAll('.mood-pill').forEach(p=>{ const active=p.dataset.mood===r.mood; p.classList.toggle('active', active); p.style.background=active?moodOf(r.mood).color:'#fff'; p.style.color=active?'#fff':'var(--ink)'; });
      document.querySelectorAll('.tag-pill').forEach(p=>p.classList.toggle('active', (r.tags||[]).includes(p.dataset.tag)));
      $('editor-text').value = r.text;
      if(r.photo){ $('photo-area').innerHTML='🖼️ 已选择照片'; window.selectedPhoto=true; }
      $('editor-title').textContent = '编辑';
      if(r.createdAt){ dateEl.value = r.createdAt.slice(0,10); }
    }
  }
}
function pickMood(el){
  document.querySelectorAll('.mood-pill').forEach(p=>{ p.classList.remove('active'); p.style.background='#fff'; p.style.color='var(--ink)'; });
  el.classList.add('active'); el.style.background=moodOf(el.dataset.mood).color; el.style.color='#fff';
}
function pickTag(el){ el.classList.toggle('active'); }
function closeEditor(){ $('overlay-editor').classList.remove('show'); }
function saveRecord(){
  const text = $('editor-text').value.trim();
  if(!text){ $('editor-text').style.borderColor='var(--m-angry)'; setTimeout(()=>$('editor-text').style.borderColor='',1200); return; }
  const mood = (document.querySelector('.mood-pill.active')||{dataset:{mood:'calm'}}).dataset.mood;
  const tags = [...document.querySelectorAll('.tag-pill.active')].map(t=>t.dataset.tag);
  const photo = window.selectedPhoto || null;
  const date = $('editor-date').value || todayKey();
  const createdDate = new Date(date + 'T12:00:00');
  if(editId){
    const r = records.find(x=>x.id===editId);
    if(r){ r.text=text; r.mood=mood; r.tags=tags; r.photo=photo; r.createdAt=createdDate.toISOString(); }
  } else {
    records.push({ id:Date.now(), text, mood, tags, photo, createdAt:createdDate.toISOString() });
  }
  save(); closeEditor(); renderTimeline();
}
$('photo-input').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => { window.selectedPhoto = ev.target.result; $('photo-area').innerHTML='🖼️ 已选择照片'; };
  reader.readAsDataURL(f);
});

// ==================== 时间线 ====================
function renderWeekStrip(){
  const weekMood = {};
  records.forEach(r=>{
    const d=new Date(r.createdAt); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!weekMood[k] || new Date(r.createdAt)>new Date(weekMood[k].createdAt)) weekMood[k]=r;
  });
  const today = todayKey();
  const base = new Date();
  const dayOfWeek = base.getDay();
  const monday = new Date(base); monday.setDate(base.getDate() - ((dayOfWeek+6)%7));
  let html = '';
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const r = weekMood[k];
    const labels = ['日','一','二','三','四','五','六'];
    const isToday = k===today;
    const moodIcon = r ? moodOf(r.mood).icon : '';
    html += '<div class="week-day'+(isToday?' today':'')+'">' +
      '<span class="w-label">周'+labels[d.getDay()]+'</span>' +
      '<span class="w-num">'+d.getDate()+'</span>' +
      '<span class="w-mood">'+moodIcon+'</span>' +
    '</div>';
  }
  $('week-strip').innerHTML = html;
}
function renderTimeline(){
  renderWeekStrip();
  const body = $('timeline-list');
  if(!records.length){
    body.innerHTML = '<div class="empty"><span class="ei">🍃</span><p>今天的心叶还空着<br>写点什么吧</p><br><button class="btn-primary" onclick="openEditor()">写第一篇</button></div>';
    return;
  }
  const sorted = [...records].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const groups = {};
  sorted.forEach(r=>{ const k=fmtDate(r.createdAt); (groups[k]=groups[k]||[]).push(r); });
  let html = '<div class="timeline">';
  Object.keys(groups).forEach(k=>{
    html += '<div class="tl-day">' +
      '<div class="tl-daydate"><i class="node"></i><b>'+k+'</b></div>' +
      groups[k].map(r=>cardHtml(r,true)).join('') +
    '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

// ==================== 月度日记 ====================
function openDiary(){
  $('overlay-diary').classList.add('show');
  const mk = monthKey();
  const monthRecords = records.filter(r=>r.createdAt.indexOf(mk)===0);
  const viewer = $('diary-viewer');
  if(!monthRecords.length){
    const d=new Date();
    viewer.innerHTML = '<div class="diary-cover"><span class="leaf">🍃</span><h2>'+d.getFullYear()+'年'+(d.getMonth()+1)+'月</h2><p>这个月还没有日记</p></div>';
    $('diary-info').textContent = '';
    window.diaryPages = [{cover:true}];
  } else {
    const moods = monthRecords.map(r=>moodOf(r.mood).label);
    const top = [...new Set(moods)].map(m=>({m,c:moods.filter(x=>x===m).length})).sort((a,b)=>b.c-a.c)[0];
    window.diaryPages = [{cover:true,count:monthRecords.length,top:top.m}, ...monthRecords];
    renderDiaryPage(0);
  }
}
function renderDiaryPage(i){
  window.diaryIndex = i;
  const pages = window.diaryPages;
  const slot = $('diary-viewer');
  if(pages[i].cover){
    const d=new Date();
    slot.innerHTML = '<div class="diary-cover"><span class="leaf">🍃</span><h2>'+d.getFullYear()+'年'+(d.getMonth()+1)+'月</h2><p>本月共 '+pages[i].count+' 篇<br>心情多为「'+pages[i].top+'」</p></div>';
  } else {
    const r = pages[i];
    const md = moodOf(r.mood);
    slot.innerHTML = '<div class="diary-page-view"><div class="card" style="box-shadow:none;margin:0;">' +
      '<div class="cardhead"><span class="mood-ico" style="background:'+md.color+';">'+md.icon+'</span><span class="time">'+fmtDateTime(r.createdAt)+'</span></div>' +
      '<div class="body">'+esc(r.text)+'</div>' + photoHtml(r.photo) + tagsHtml(r.tags) + '</div></div>';
  }
  $('diary-info').textContent = (i+1)+' / '+pages.length;
}
function diaryFlip(dir){
  const pages = window.diaryPages;
  let ni = (window.diaryIndex||0) + dir;
  if(ni<0 || ni>=pages.length) return;
  const slot = $('diary-viewer');
  slot.classList.add(dir>0?'next':'prev');
  setTimeout(()=>{ renderDiaryPage(ni); slot.classList.remove('next','prev'); },250);
}
function closeDiary(){ $('overlay-diary').classList.remove('show'); }

// ==================== 统计 ====================
let period = 'month';
function setPeriod(p){
  period = p;
  $('seg-month').classList.toggle('active', p==='month');
  $('seg-all').classList.toggle('active', p==='all');
  renderStats();
}
function filtered(){
  if(period==='all') return records;
  const mk = monthKey();
  return records.filter(r=>r.createdAt.indexOf(mk)===0);
}
function renderStats(){
  const list = filtered();
  const y = new Date().getFullYear(), m = new Date().getMonth();
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const count = {};
  list.forEach(r=>{ const d=new Date(r.createdAt); const k=d.getDate(); count[k]=(count[k]||0)+1; });
  let hh = '';
  for(let i=0;i<first;i++) hh += '<div></div>';
  for(let d=1;d<=days;d++){
    const c = count[d]||0;
    const alpha = c===0 ? 0 : Math.min(.22+c*.15, 1);
    hh += '<div class="heat-cell" style="background:rgba(126,146,128,'+alpha+');"></div>';
  }
  $('heat-grid').innerHTML = hh;
  const mcount = {};
  MOODS.forEach(m=>mcount[m.key]=0);
  list.forEach(r=>mcount[r.mood]=(mcount[r.mood]||0)+1);
  const total = list.length;
  $('mood-ring').innerHTML = ringSvg(mcount, total);
  $('mood-legend').innerHTML = MOODS.map(m=>'<div class="legend-row"><span class="dot" style="background:'+m.color+';"></span>'+m.label+'<span class="cnt">'+mcount[m.key]+'</span></div>').join('');
  const tcount = {};
  list.forEach(r=>(r.tags||[]).forEach(t=>tcount[t]=(tcount[t]||0)+1));
  const tkeys = Object.keys(tcount);
  let bars = tkeys.length ? '' : '<div style="font-size:13px;color:var(--ink-soft);">还没有标签记录</div>';
  tkeys.forEach(t=>{
    bars += '<div class="bar-row"><div class="bar-head"><span>'+t+'</span><span>'+tcount[t]+' 篇 · '+(total? Math.round(tcount[t]/total*100):0)+'%</span></div><div class="bar-track"><div class="bar-fill" style="width:'+(total? (tcount[t]/total*100):0)+'%; background:'+(TARCO[t]||'var(--leaf)')+';"></div></div></div>';
  });
  $('tag-bars').innerHTML = bars;
}
function ringSvg(mcount, total){
  if(!total) return '<div class="ring-center"><b>0</b><span>条记录</span></div>';
  const R=64, cx=64, cy=64, C=2*Math.PI*R;
  let offset=0, segs='';
  MOODS.forEach(m=>{
    const frac = mcount[m.key]/total;
    if(frac>0){
      const dash = frac*C;
      segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+m.color+'" stroke-width="26" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      offset += dash;
    }
  });
  return '<svg width="128" height="128">'+segs+'<div class="ring-center"><b>'+total+'</b><span>条记录</span></div></svg>';
}

// ==================== 设置 ====================
function showClearModal(){ $('clear-modal').classList.add('show'); }
function hideClearModal(){ $('clear-modal').classList.remove('show'); }
function clearAll(){
  records = []; save(); renderTimeline(); renderSidebarCalendar(); renderStats();
  hideClearModal();
}

// ==================== 初始化 ====================
renderTimeline();
</script>
